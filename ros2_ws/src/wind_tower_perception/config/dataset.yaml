# YOLOv8 dataset descriptor for the wind-tower defect dataset.
#
# This file is meant to live INSIDE the dataset directory produced by
# ``synthetic_capture_node`` (default:
# ``~/ROS2_Wind_Tower_Inspection/ros2_ws/datasets/wind_tower_dataset``).
# Copy it there before training:
#
#   cp src/wind_tower_perception/config/dataset.yaml datasets/wind_tower_dataset/
#
# ``path`` is a relative anchor; ``train`` and ``val`` are resolved against it.
# Ultralytics also tolerates absolute paths if you prefer.

path: .
train: images/train
val: images/val

names:
  0: rust
  1: pitting
  2: through_hole
