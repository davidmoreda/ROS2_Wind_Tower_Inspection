defect_detector:
  ros__parameters:
    image_topic: /inspection/camera/image_raw
    backend: yolo
    publish_annotated: true

    yolo:
      model_path: ~/ROS2_Wind_Tower_Inspection/ros2_ws/models/best.pt
      conf_threshold: 0.25
      iou_threshold: 0.45
      imgsz: 640
      device: cpu            # set '0' for the first GPU

    hough:
      gaussian_blur_kernel: 7
      dp: 1.2
      min_dist_px: 40.0
      canny_high: 120.0
      accumulator_threshold: 30.0
      min_radius_px: 8
      max_radius_px: 120
      score_constant: 0.6

image_capture:
  ros__parameters:
    image_topic: /inspection/camera/image_raw
    detections_topic: /inspection/detections/text
    cylindrical_pose_topic: /inspection/cylindrical_pose
    mission_state_topic: /inspection/state_text

    output_root: ~/ROS2_Wind_Tower_Inspection/inspections

    save_on_detection: true
    save_heartbeat: true
    heartbeat_period_s: 5.0
    min_capture_period_s: 0.5
    jpeg_quality: 90
    require_in_tube_limits: false
    detection_freshness_s: 1.0

defect_mapper:
  ros__parameters:
    detections_topic: /inspection/detections/raw
    camera_info_topic: /inspection/camera/camera_info
    cylindrical_pose_topic: /inspection/cylindrical_pose
    turner_angle_topic: /turner/angle

    camera_frame: inspection_camera_optical_frame
    cylinder_frame: world

    cylinder:
      axis_origin_x_m: 0.0
      axis_origin_y_m: 0.0
      axis_origin_z_m: 4.0
      axis_direction: "y"
      radius_m: 3.925
      x_axial_offset_m: 0.0

    cluster:
      x_tol_m: 0.30
      theta_tol_deg: 5.0
      max_observations_keep: 10000

    tf_timeout_s: 0.2
    min_detection_score: 0.0
