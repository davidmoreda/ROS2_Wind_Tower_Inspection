arm_inspection:
  ros__parameters:
    # --- Coordination topics (contract, TEAM_WORKFLOW.md §3) ---------------
    state_text_topic: /inspection/state_text
    autonomous_active_topic: /inspection/autonomous_active
    joint_states_topic: /robot/platform/joint_states
    move_group_action: /move_action
    planning_group: arm_0

    joint_names:
      - arm_0_shoulder_pan_joint
      - arm_0_shoulder_lift_joint
      - arm_0_elbow_joint
      - arm_0_wrist_1_joint
      - arm_0_wrist_2_joint
      - arm_0_wrist_3_joint

    # If true, the node stays PASSIVE (does not command the arm) whenever
    # /inspection/autonomous_active is false — so it never fights ps5_teleop,
    # and so you can freely jog the arm to capture the base pose.
    # (The joy override below is INDEPENDENT and bypasses this gate.)
    require_autonomous_active: true
    publish_rate_hz: 5.0

    # --- PS5 DualSense bindings -------------------------------------------
    # Direct buttons on the pad to drive the arm without going through the
    # mission state machine. The override bypasses require_autonomous_active,
    # so they work even with autonomous off — which is the natural setup for
    # manual joy control, because dualsense_joy in wind_tower_bringup masks
    # every button except STOP (Circle) when autonomous is true. Pressing
    # autonomous_active=true clears the override automatically.
    #
    # Indices below match Dani's machine (kernel-specific evdev mapping):
    #   R1       = btn 2 -> HOME
    #   Triangle = btn 3 -> SWEEP (inspection)
    enable_joy_control: true
    joy_topic: /robot/joy_teleop/joy
    joy_button_home: 2       # R1
    joy_button_sweep: 3      # Triangle

    # --- Planning -----------------------------------------------------------
    velocity_scaling: 0.15
    acceleration_scaling: 0.15
    planning_time_s: 5.0
    planning_attempts: 10
    joint_goal_tolerance_rad: 0.01
    retry_cooldown_s: 3.0

    # --- Mission state -> arm behaviour ------------------------------------
    # Parallel lists. Behaviour is one of: home, hold_lookat, sweep.
    # Cubrimos AMBAS familias de estados:
    #  - Legacy state machine (AXIAL_SCAN/INDEX_TUBE/DETAIL_SCAN/IDLE)
    #  - mission_controller actual (MOVING_TO_INSPECTION_POINT,
    #    INSPECTING, APPROACHING_INSPECTION, ...) — los publica directamente
    #    en /inspection/state_text.
    # En cada parada (INSPECTING) el arm hace sweep 360° + vuelta a home;
    # entre puntos (MOVING_TO_INSPECTION_POINT) mantiene la pose apuntando
    # a la pared para que la cámara grabe en streaming.
    mission_states:
      - AXIAL_SCAN
      - INDEX_TUBE
      - DETAIL_SCAN
      - IDLE
      - MOVING_TO_INSPECTION_POINT
      - INSPECTING
      - APPROACHING_INSPECTION
      - INSPECTION_ABORTED
      - INSPECTION_GUARD_STOP
    mission_behaviours:
      - hold_lookat
      - hold_lookat
      - sweep
      - home
      - hold_lookat
      - sweep
      - home
      - home
      - home
    default_behaviour: home

    # --- Poses (joint order = joint_names, radians) ------------------------
    # home: pose with the camera looking slightly down at the tube wall.
    # elbow subido (+0.3 rad ≈ +17°) → la cámara mira más al suelo.
    home_joint_positions: [0.0000, -0.9774, 1.1727, -3.1591, 0.0000, 0.5934]

    # hold_lookat: pose held during navigation between inspection points.
    # Same as home — camera apuntando a la pared del tubo con tilt hacia abajo.
    hold_lookat_joint_positions: [0.0000, -0.9774, 1.1727, -3.1591, 0.0000, 0.5934]
    hold_lookat_pose_file: ~/.wind_tower_arm/hold_lookat.json

    # --- Sweep waypoints ---------------------------------------------------
    # Explicit list of poses to visit during DETAIL_SCAN. Six joint values per
    # waypoint (in joint_names order = pan, lift, elbow, w1, w2, w3),
    # concatenated end-to-end. With sweep_via_home=true the full run is
    # home -> waypoint_1 -> ... -> waypoint_N -> home.
    #
    # Capture poses by jogging the arm in RViz (MotionPlanning -> Joints tab),
    # checking the camera view, and reading the slider values.
    sweep_via_home: false
    sweep_joint_positions_flat:
      # Barrido 360° con DIRECCIÓN ALTERNANTE entre paradas:
      #   - Parada 1: pan 0° → -45° → -90° → ... → -360° (gira derecha)
      #   - Parada 2: pan -360° → -315° → -270° → ... → 0° (gira izquierda)
      #   - Parada 3: 0° → -360° otra vez, etc.
      # Así el arm nunca vuelve por el mismo camino — cada sweep es un
      # 360° unidireccional. El código (arm_inspection_node) invierte
      # automáticamente la dirección de los waypoints al final de cada
      # sweep, así que SOLO listamos los 8 waypoints "normales" aquí.
      #
      # NOTA: para que MoveIt no rechace -360° como out-of-bounds, hay
      # que parchear el URDF a shoulder_pan_joint type="continuous" Y
      # has_position_limits=false en joint_limits.yaml (instrucciones
      # en commits anteriores).
      #
      # elbow subido a 1.1727 rad (~+17°) → cámara mira más al suelo.
      [-0.7854, -0.9774, 1.1727, -3.1591, 0.0000, 0.5934,   # pan =  -45°
       -1.5708, -0.9774, 1.1727, -3.1591, 0.0000, 0.5934,   # pan =  -90°
       -2.3562, -0.9774, 1.1727, -3.1591, 0.0000, 0.5934,   # pan = -135°
       -3.1416, -0.9774, 1.1727, -3.1591, 0.0000, 0.5934,   # pan = -180°
       -3.9270, -0.9774, 1.1727, -3.1591, 0.0000, 0.5934,   # pan = -225°
       -4.7124, -0.9774, 1.1727, -3.1591, 0.0000, 0.5934,   # pan = -270°
       -5.4978, -0.9774, 1.1727, -3.1591, 0.0000, 0.5934,   # pan = -315°
       -6.2832, -0.9774, 1.1727, -3.1591, 0.0000, 0.5934]   # pan = -360°
