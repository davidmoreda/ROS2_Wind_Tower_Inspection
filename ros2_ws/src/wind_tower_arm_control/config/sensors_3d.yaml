# 3-D sensors that feed MoveIt's occupancy_map_monitor (octomap).
#
# Each entry instantiates one updater plugin. PointCloudOctomapUpdater
# consumes a sensor_msgs/PointCloud2 and inserts it into the octomap that
# move_group uses for collision checking, after self-filtering (so the arm
# does not see its own links as obstacles).
#
# Source: the Velodyne VLP-16 LiDAR mounted on the Husky top plate, already
# bridged from Gazebo to /velodyne_points by simulation.launch.py.

sensors:
  - sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
    point_cloud_topic: /velodyne_points
    max_range: 5.0            # ignore returns beyond 5 m (the tube is bigger
                              # than the arm can reach; keeps the octomap
                              # focused on what could actually be hit).
    point_subsample: 1        # use every point (Velodyne is already sparse)
    padding_offset: 0.1       # 10 cm self-filtering pad around robot links
    padding_scale: 1.0
    max_update_rate: 1.0      # update at 1 Hz — plenty for collision checks,
                              # keeps CPU low.
    filtered_cloud_topic: octomap_filtered_cloud
