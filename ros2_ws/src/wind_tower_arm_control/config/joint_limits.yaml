# MoveIt joint limits for the UR5e arm (planning group "arm_0").
#
# Velocity limits match the UR5e datasheet (all joints 180 deg/s = pi rad/s).
# Acceleration limits are conservative estimates: the UR firmware does not
# expose them, and a slow inspection task does not need aggressive motion.
# The scaling factors below keep every planned trajectory gentle; raise them
# only if motions feel too slow.

default_velocity_scaling_factor: 0.20
default_acceleration_scaling_factor: 0.20

joint_limits:
  arm_0_shoulder_pan_joint:
    has_velocity_limits: true
    max_velocity: 3.14159
    has_acceleration_limits: true
    max_acceleration: 5.0
  arm_0_shoulder_lift_joint:
    has_velocity_limits: true
    max_velocity: 3.14159
    has_acceleration_limits: true
    max_acceleration: 5.0
  arm_0_elbow_joint:
    has_velocity_limits: true
    max_velocity: 3.14159
    has_acceleration_limits: true
    max_acceleration: 5.0
  arm_0_wrist_1_joint:
    has_velocity_limits: true
    max_velocity: 3.14159
    has_acceleration_limits: true
    max_acceleration: 6.0
  arm_0_wrist_2_joint:
    has_velocity_limits: true
    max_velocity: 3.14159
    has_acceleration_limits: true
    max_acceleration: 6.0
  arm_0_wrist_3_joint:
    has_velocity_limits: true
    max_velocity: 3.14159
    has_acceleration_limits: true
    max_acceleration: 6.0
