# Inverse-kinematics solver for the UR5e planning group "arm_0".
#
# KDL is used because it ships with MoveIt and needs no extra packages.
# For the UR5e it is adequate but not the fastest; if you install
# `ros-jazzy-trac-ik-kinematics-plugin` you can switch to:
#   kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
# which converges more reliably on this 6-DOF arm.
arm_0:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
