amcl:
  ros__parameters:
    use_sim_time: true

    # ── Modelo de movimiento (differential drive) ─────────────────────────────
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2   # ruido rotacional por rotación
    alpha2: 0.2   # ruido rotacional por traslación
    alpha3: 0.2   # ruido traslacional por traslación
    alpha4: 0.2   # ruido traslacional por rotación
    alpha5: 0.2   # (solo skid-steer, ignorado en diff-drive)

    # ── Número de partículas ───────────────────────────────────────────────────
    min_particles: 500
    max_particles: 2000

    # ── Frames ────────────────────────────────────────────────────────────────
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"

    # ── IMPORTANTE: tf_broadcast FALSE ────────────────────────────────────────
    # AMCL NO publica map→odom directamente.
    # En su lugar, publica /amcl_pose que entra en EKF2 (ekf_map_node).
    # EKF2 es quien publica map→odom con filtrado suave.
    # Si ponemos tf_broadcast: true aquí Y EKF2 también publica map→odom
    # habrá conflicto de TF y comportamiento errático.
    tf_broadcast: false

    # ── Topic del lidar ───────────────────────────────────────────────────────
    scan_topic: /scan

    # ── Pose inicial ──────────────────────────────────────────────────────────
    # Posición de arranque del robot (esquina/origen del mapa).
    # Si usas RViz "2D Pose Estimate" al inicio, AMCL se relocaliza.
    # Estos valores son el fallback si no se da pose inicial.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    # ── Actualización del filtro ───────────────────────────────────────────────
    update_min_d: 0.25         # distancia mínima (m) para actualizar partículas
    update_min_a: 0.2          # ángulo mínimo (rad) para actualizar partículas
    resample_interval: 1       # ciclos entre resamplings

    # ── Modelo del lidar ──────────────────────────────────────────────────────
    laser_model_type: "likelihood_field"
    laser_max_range: 12.0
    laser_min_range: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_beams: 60
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5

    # ── Eficiencia ────────────────────────────────────────────────────────────
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
    pf_err: 0.05
    pf_z: 0.99
    save_pose_rate: 0.5
    transform_tolerance: 0.5
