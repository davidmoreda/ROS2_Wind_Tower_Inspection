serial_number: a200-0000
version: 0

system:
  hosts:
    - hostname: wind-tower-inspector
      ip: 192.168.131.1
  ros2:
    namespace: robot

platform:
  attachments:
    - name: front_bumper
      type: a200.bumper
      parent: front_bumper_mount
    - name: rear_bumper
      type: a200.bumper
      parent: rear_bumper_mount
    - name: top_plate
      type: a200.top_plate
      model: pacs

manipulators:
  arms:
    - model: universal_robots
      parent: default_mount
      xyz: [0.0, 0.0, 0.0]
      rpy: [0.0, 0.0, 0.0]
      ur_type: ur5e
      robot_ip: 192.168.131.40
      headless_mode: false
      kinematics_parameters_file: "$(find ur_description)/config/ur5e/default_kinematics.yaml"
      poses:
        - name: home
          joints: [0.0, -1.57, 0.0, -1.57, 0.0, 0.0]

sensors:
  lidar2d:
    - model: hokuyo_ust
      urdf_enabled: true
      launch_enabled: false
      parent: front_bumper_mount
      xyz: [0.0, 0.0, 0.1]
      rpy: [0.0, 0.0, 0.0]
  camera:
    - model: intel_realsense
      urdf_enabled: true
      launch_enabled: false
      parent: default_mount
      xyz: [0.0, 0.0, 0.5]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        camera:
          camera_name: inspection_camera
          device_type: d435
          serial_no: "0"
          enable_color: true
          rgb_camera.profile: 1280,720,30
          enable_depth: true
          depth_module.profile: 1280,720,30
