pointcloud_to_laserscan_node:
  ros__parameters:
    # Transforma la nube al frame base antes de filtrar altura
    target_frame: base_link
    transform_tolerance: 0.5

    # Slice horizontal: 0.45–0.80 m sobre base_link
    # 0.45: ignora la rampa (altura máx ~0.40 m) y el suelo inclinado
    # Obstáculos relevantes (barreras 1.2m, viradores 0.8m) siguen detectados
    min_height:  0.45
    max_height:  0.80

    angle_min: -3.14159265
    angle_max:  3.14159265
    angle_increment: 0.008726646   # 0.5 grados
    scan_time: 0.1                  # 10 Hz — coincide con VLP-16
    range_min: 0.5
    range_max: 25.0
    use_inf: true
    inf_epsilon: 1.0
