# ── BT Navigator ─────────────────────────────────────────────────────────────
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /robot/platform/odom/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # TwistStamped porque Clearpath twist_mux tiene use_stamped: true
    enable_stamped_cmd_vel: true
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

# ── Controller Server (DWB local planner) ────────────────────────────────────
# RAMP-AWARE TUNING:
#   La rampa norte tiene ~13° de pendiente. El límite principal observado es
#   tracción, no potencia: si el robot acelera o frena fuerte, patina y AMCL/odom
#   pierden coherencia. Priorizamos velocidad baja, aceleración suave y tiempos
#   de progreso más amplios para subir sin cortar la referencia.
#
# DYNAMIC-OBSTACLE TUNING:
#   RegulatedPurePursuit seguía el path global y aquí estaba con collision
#   detection/cost scaling desactivado, así que el local costmap podía ver
#   personas/carretilla pero el controller no generaba evasión lateral.
#   DWB simula trayectorias locales contra el local_costmap y descarta las que
#   chocan con obstáculos LiDAR. El global_costmap queda estático por diseño.
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    # Umbral mínimo subido: por debajo de 0.05 m/s la rueda no rompe la fricción
    # estática en la rampa y el robot se queda atascado mandando comandos diminutos
    min_x_velocity_threshold: 0.05
    min_y_velocity_threshold: 0.5        # diff-drive: Y siempre 0, threshold alto es seguro
    min_theta_velocity_threshold: 0.001
    # Ampliado: un slip momentáneo en la rampa NO debe abortar el BT
    failure_tolerance: 1.0
    # Nav2 controller → velocity_smoother (cadena estándar Nav2)
    # El smoother publica en cmd_vel_out_topic → twist_mux /robot/cmd_vel
    # TwistStamped porque Clearpath twist_mux tiene use_stamped: true
    enable_stamped_cmd_vel: true
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Reducido para detectar progreso real sobre la rampa (el robot avanza
      # despacio pero avanza). Sin esto el progress_checker dispara antes de
      # que coronemos la pendiente.
      required_movement_radius: 0.15
      movement_time_allowance: 30.0     # ampliado: rampa larga + posible slip

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.15

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false

      # Diff-drive Husky: solo vx y wz. Sin marcha atrás para no meter el robot
      # hacia obstáculos que aparecen detrás durante una evasión.
      min_vel_x: 0.0
      max_vel_x: 0.80
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.85
      min_speed_xy: 0.0
      max_speed_xy: 0.80
      min_speed_theta: 0.0

      # Mantiene la suavidad necesaria en la rampa y evita bandazos al esquivar.
      acc_lim_x: 0.75
      acc_lim_y: 0.0
      acc_lim_theta: 0.8
      decel_lim_x: -0.75
      decel_lim_y: 0.0
      decel_lim_theta: -0.8

      vx_samples: 24
      vy_samples: 1
      vtheta_samples: 36
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 1.0
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true

      critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist

      # BaseObstacle + inflation local dan prioridad a separarse de objetos
      # móviles/no mapeados; Path* queda por debajo para permitir rodeos locales.
      BaseObstacle.scale: 0.8
      PathAlign.scale: 8.0
      PathAlign.forward_point_distance: 0.45
      GoalAlign.scale: 6.0
      GoalAlign.forward_point_distance: 0.45
      PathDist.scale: 12.0
      GoalDist.scale: 10.0
      RotateToGoal.scale: 20.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

# ── Smoother Server ───────────────────────────────────────────────────────────
smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

# ── Planner Server (NavFn / Dijkstra) ────────────────────────────────────────
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

# ── Behavior Server ───────────────────────────────────────────────────────────
behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 1.0        # reducido: 2.0s era demasiado restrictivo para spin
    max_rotational_vel: 1.0         # aumentado: llegar a 1.57 rad antes del timeout
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0

# ── Velocity Smoother ─────────────────────────────────────────────────────────
# Cadena de cmd_vel en Nav2:
#   controller_server → cmd_vel_smoothed → velocity_smoother → /robot/cmd_vel
# Clearpath twist_mux (use_stamped: True) escucha en /robot/cmd_vel (externo).
# Usamos TwistStamped porque twist_mux de Clearpath tiene use_stamped: true.
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    # scale_velocities=true mantiene la proporción v/w cuando alguna componente
    # se satura: evita que el robot pierda dirección mientras intenta acelerar.
    scale_velocities: true
    # OPEN_LOOP: el smoother no espera feedback del wheel-odom para acelerar.
    # En la rampa el wheel-odom se vuelve poco fiable por el slip; CLOSED_LOOP
    # haría que el smoother "no creyera" que ya estamos a velocidad y mandaría
    # rampas extra al motor. Mejor mandar la rampa abierta y dejar que Nav2
    # detecte fallo si no se mueve.
    feedback: "OPEN_LOOP"
    # Limites conservadores para rampa: menos pico de velocidad y aceleraciones
    # suaves reducen slip y evitan saltos bruscos en odometria/AMCL.
    max_velocity: [0.85, 0.0, 0.9]
    min_velocity: [-0.85, 0.0, -0.9]
    max_accel: [0.75, 0.0, 0.8]    # angular: era 1.0 → reducido para suavizar w
    max_decel: [-0.75, 0.0, -0.8]  # angular: era -1.0 → simétrico
    odom_topic: /robot/platform/odom/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    # TwistStamped porque Clearpath twist_mux tiene use_stamped: true
    enable_stamped_cmd_vel: true
    # NOTA: los topics se controlan mediante remaps en el launch file:
    #   SUB cmd_vel  (salida del controller_server, sin remap)
    #   PUB cmd_vel_smoothed → remapeado a /robot/cmd_vel (slot external twist_mux)

# ── Waypoint Follower ─────────────────────────────────────────────────────────
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

# ── Local Costmap ─────────────────────────────────────────────────────────────
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      # 5×5m: suficiente para DWB (sim_time 2.0s × max_vel 0.8 = 1.6m lookahead),
      # menor que 8×8 reduce el smearing del rolling window y la latencia de raytrace.
      width:  5
      height: 5
      resolution: 0.05
      # Husky A200: 0.99 × 0.67 m — polígono rectangular
      footprint: "[[0.50, 0.34],[0.50, -0.34],[-0.50, -0.34],[-0.50, 0.34]]"
      footprint_padding: 0.06
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # Fuente: /obstacle_points, salida del nodo obstacle_cloud_filter. Ese nodo
        # ya hace ground-removal consciente de pendiente (resta el suelo local por
        # celda), así que la rampa de 13° NO llega aquí pero los objetos bajos y las
        # paredes SÍ. Es nube 3D filtrada en 360° (mejor que el slice /scan, que se
        # dejaba los objetos por debajo de 0.55 m). El min/max_obstacle_height de
        # abajo va permisivo porque el filtrado de altura ya está hecho upstream.
        observation_sources: obstacles
        footprint_clearing_enabled: true
        obstacles:
          topic: /obstacle_points
          max_obstacle_height: 2.5
          min_obstacle_height: -1.0     # suelo ya eliminado por obstacle_cloud_filter
          clearing: true
          marking: true
          data_type: "PointCloud2"
          expected_update_rate: 8.0        # VLP-16 ~10 Hz; valor correcto para stale-detection
          observation_persistence: 0.30   # 3 scans a 10 Hz: estabilidad sin fantasmas largos
          raytrace_max_range: 4.0         # diagnonal de 5×5m ≈ 3.5m → 4.0 con margen
          raytrace_min_range: 0.12
          obstacle_max_range: 3.5         # consistente con ventana de 5m (radio 2.5m + margen)
          obstacle_min_range: 0.12
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.5
        # 0.50m: radio circunscrito Husky ~0.61m; con 0.50 de inflación pasillo mínimo=
        # robot_width(0.67) + 2×0.50 = 1.67m. Con 0.65 era 1.97m → bloqueaba pasillos.
        # Global queda en 0.65 (más conservador) → NavFn planifica lejos de paredes,
        # DWB ejecuta con más holgura → no hay mismatch en dirección problemática.
        inflation_radius: 0.50
      always_send_full_costmap: true

# ── Global Costmap ─────────────────────────────────────────────────────────────
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      # Nave 40×60m — dimensiones explícitas para cubrir el entorno completo.
      # Con static_layer de SLAM el mapa crece dinámicamente; estos valores
      # son el mínimo garantizado antes de que el static layer lo amplíe.
      width: 200
      height: 200
      track_unknown_space: true
      footprint: "[[0.50, 0.34],[0.50, -0.34],[-0.50, -0.34],[-0.50, 0.34]]"
      footprint_padding: 0.02
      # El mapa guardado sigue viniendo de static_layer. La obstacle_layer es
      # una capa temporal del costmap para que el planner pueda replantear si
      # aparece una persona/carretilla bloqueando el path. No escribe ni cambia
      # el mapa .pgm/.yaml.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # Misma fuente que el local: /obstacle_points (obstacle_cloud_filter), que
        # ya elimina el suelo/rampa por celda y conserva objetos bajos y paredes.
        # Así el global puede replantear ante obstáculos nuevos sin marcar la rampa.
        observation_sources: obstacles
        footprint_clearing_enabled: true
        obstacles:
          topic: /obstacle_points
          max_obstacle_height: 2.5
          min_obstacle_height: -1.0     # suelo ya eliminado por obstacle_cloud_filter
          clearing: true
          marking: true
          data_type: "PointCloud2"
          expected_update_rate: 0.5        # warn si no hay datos en 0.5s (≈5 scans VLP-16)
          observation_persistence: 0.30
          raytrace_max_range: 6.0
          raytrace_min_range: 0.12
          obstacle_max_range: 5.0
          obstacle_min_range: 0.12
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Antes 5.0/0.45: radius < radio circunscrito Husky (0.60m) → NavFn trazaba
        # el path rozando el obstáculo en vez de rodearlo (parecía "no replanifica").
        # Alineado con el local (0.65/3.0): banda de coste ancha → rodeo global real.
        cost_scaling_factor: 3.0
        inflation_radius: 0.65         # ≥ radio circunscrito (0.60m) → holgura segura
      always_send_full_costmap: true

# NOTA: lifecycle_manager_navigation NO se define aquí porque navigation_launch.py
# de nav2_bringup ya crea su propio lifecycle manager con autostart=true.
# Definirlo aquí también causaría dos managers compitiendo y los nodos nunca
# llegarían a estado Active (action server navigate_to_pose no se registraría).
