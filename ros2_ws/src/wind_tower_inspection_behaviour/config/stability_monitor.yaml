stability_monitor:
  ros__parameters:
    imu_topic: /robot/sensors/imu_0/data
    odom_topic: /robot/platform/odom/filtered
    cylinder_stats_topic: /cylinder_fit/stats
    turner_angle_topic: /turner/angle

    imu_calibration:
      auto_calibrate_on_start: true
      sample_count: 50
      roll_offset_deg: 0.0
      pitch_offset_deg: 0.0
      lateral_angle_offset_deg: 0.0

    bottom_lane:
      max_roll_deg: 5.0
      max_pitch_deg: 5.0
      max_lateral_angle_deg: 8.0
      max_accel_error: 1.0

    geometry:
      min_wall_points: 300
      max_fit_rms: 0.35
      min_fit_radius: 3.4
      max_fit_radius: 4.2

    motion:
      max_scan_speed: 0.30
      max_index_speed: 0.02
      max_yaw_rate: 0.10

    freshness:
      max_imu_age_s: 0.5
      max_odom_age_s: 0.5
      max_geometry_age_s: 1.0
      max_turner_age_s: 1.0
